<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña - Gestor de Tareas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <button class="theme-toggle theme-toggle-flotante" aria-label="Cambiar tema">
        <span class="icono-tema">🌙</span>
    </button>

    <div class="container">
        <h1>🔑 Nueva contraseña</h1>
        <h2>Elige una contraseña segura</h2>

        <form id="reset-form">
            <div class="form-group">
                <label for="password">Nueva contraseña (mínimo 8 caracteres):</label>
                <input type="password" id="password" required minlength="8" autofocus>
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirmar contraseña:</label>
                <input type="password" id="password_confirm" required minlength="8">
            </div>

            <button type="submit">Actualizar contraseña</button>
        </form>

        <div id="mensaje-error" class="error hidden"></div>
    </div>

    <!-- Modal de éxito -->
    <div id="modal-password-cambiada" class="modal hidden">
        <div class="modal-content modal-exito">
            <div class="exito-icono">
                <svg class="check-svg" viewBox="0 0 52 52">
                    <circle class="check-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="check-mark" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h2 class="exito-titulo">¡Contraseña actualizada!</h2>
            <p class="exito-texto">
                Tu contraseña se cambió correctamente.<br>
                Serás redirigido al inicio de sesión...
            </p>
            <div class="exito-progress">
                <div class="exito-progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        window.RESET_TOKEN = "{{ token }}";
    </script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/password_reset.js') }}"></script>
</body>
</html>
