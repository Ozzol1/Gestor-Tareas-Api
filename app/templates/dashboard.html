<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestor de Tareas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dashboard-body">
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>📋 Mis Tareas</h1>
            <div class="header-actions">
                <span id="user-email" class="user-email"></span>
                <button id="btn-logout" class="btn-logout" title="Cerrar sesión">
                    <span class="icono-logout">🚪</span>
                    <span>Salir</span>
                </button>
            </div>
        </header>

        <div id="mensaje-error" class="error hidden"></div>
        <div id="mensaje-exito" class="exito hidden"></div>

        <!-- Formulario de nueva tarea -->
        <section class="nueva-tarea">
            <h2>➕ Nueva Tarea</h2>
            <form id="form-nueva-tarea">
                <div class="form-row">
                    <div class="form-group">
                        <label for="titulo">Título:</label>
                        <input type="text" id="titulo" required>
                    </div>
                    <div class="form-group">
                        <label for="prioridad">Prioridad:</label>
                        <select id="prioridad">
                            <option value="baja">🟢 Baja</option>
                            <option value="media" selected>🟡 Media</option>
                            <option value="alta">🔴 Alta</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fecha_limite">Fecha límite:</label>
                        <input type="date" id="fecha_limite">
                    </div>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción (opcional):</label>
                    <textarea id="descripcion" rows="2"></textarea>
                </div>

                <button type="submit">Crear Tarea</button>
            </form>
        </section>

        <!-- Filtros y exportación -->
        <section class="filtros">
            <div class="filtros-grupo">
                <button class="filtro-btn active" data-filtro="todas">Todas</button>
                <button class="filtro-btn" data-filtro="pendientes">⏳ Pendientes</button>
                <button class="filtro-btn" data-filtro="completadas">✅ Completadas</button>
            </div>
            <div class="exportar-grupo">
                <button id="btn-export-pdf" class="btn-export btn-export-pdf" title="Descargar todas las tareas en PDF">
                    📄 Exportar PDF
                </button>
                <button id="btn-export-excel" class="btn-export btn-export-excel" title="Descargar todas las tareas en Excel">
                    📊 Exportar Excel
                </button>
            </div>
        </section>

        <!-- Lista de tareas -->
        <section id="lista-tareas" class="lista-tareas">
            <!-- Aquí se renderizan las tareas, skeletons, o empty state -->
        </section>
    </div>

    <!-- Modal de edición -->
    <div id="modal-editar" class="modal hidden">
        <div class="modal-content">
            <h2>Editar Tarea</h2>
            <form id="form-editar">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="edit-titulo">Título:</label>
                    <input type="text" id="edit-titulo" required>
                </div>
                <div class="form-group">
                    <label for="edit-descripcion">Descripción:</label>
                    <textarea id="edit-descripcion" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-prioridad">Prioridad:</label>
                        <select id="edit-prioridad">
                            <option value="baja">🟢 Baja</option>
                            <option value="media">🟡 Media</option>
                            <option value="alta">🔴 Alta</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edit-fecha_limite">Fecha límite:</label>
                        <input type="date" id="edit-fecha_limite">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" id="btn-cancelar-edicion" class="btn-secondary">Cancelar</button>
                    <button type="submit" id="btn-guardar-edicion">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de exportar tarea -->
    <div id="modal-exportar" class="modal hidden">
        <div class="modal-content modal-exportar">
            <h2>📥 Exportar Tarea</h2>
            <p id="exportar-titulo" class="exportar-subtitulo"></p>
            <div class="exportar-opciones">
                <button type="button" class="btn-export-opcion btn-export-txt" data-formato="txt">
                    <span class="icono-formato">📄</span>
                    <span class="nombre-formato">TXT</span>
                    <span class="desc-formato">Texto plano</span>
                </button>
                <button type="button" class="btn-export-opcion btn-export-pdf" data-formato="pdf">
                    <span class="icono-formato">📕</span>
                    <span class="nombre-formato">PDF</span>
                    <span class="desc-formato">Documento</span>
                </button>
                <button type="button" class="btn-export-opcion btn-export-excel" data-formato="excel">
                    <span class="icono-formato">📊</span>
                    <span class="nombre-formato">Excel</span>
                    <span class="desc-formato">Hoja de cálculo</span>
                </button>
            </div>
            <div class="modal-actions">
                <button type="button" id="btn-cancelar-exportar" class="btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación de cerrar sesión -->
    <div id="modal-logout" class="modal hidden">
        <div class="modal-content modal-confirm">
            <div class="confirm-icon">👋</div>
            <h2 class="confirm-titulo">¿Cerrar sesión?</h2>
            <p class="confirm-texto">
                Tendrás que iniciar sesión de nuevo para acceder a tus tareas.
            </p>
            <div class="modal-actions confirm-actions">
                <button type="button" id="btn-cancelar-logout" class="btn-secondary">Cancelar</button>
                <button type="button" id="btn-confirmar-logout" class="btn-danger">Sí, cerrar sesión</button>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación de eliminar tarea -->
    <div id="modal-eliminar" class="modal hidden">
        <div class="modal-content modal-confirm">
            <div class="confirm-icon">🗑️</div>
            <h2 class="confirm-titulo">¿Eliminar tarea?</h2>
            <p class="confirm-texto" id="eliminar-nombre-tarea"></p>
            <p class="confirm-texto-small">Esta acción no se puede deshacer.</p>
            <div class="modal-actions confirm-actions">
                <button type="button" id="btn-cancelar-eliminar" class="btn-secondary">Cancelar</button>
                <button type="button" id="btn-confirmar-eliminar" class="btn-danger">Sí, eliminar</button>
            </div>
        </div>
    </div>

    <!-- Contenedor de toasts (notificaciones flotantes) -->
    <div id="toast-container" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tareas.js') }}"></script>
</body>
</html>
