<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestor de Tareas</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
        <!-- SEO -->
        <meta name="description" content="Gestor de tareas con API REST, autenticación JWT y frontend en vanilla JS. Producto interno de NovaTech.">
        <meta name="author" content="Khale Rodríguez - NovaTech">
    
        <!-- Open Graph (para WhatsApp, Twitter, LinkedIn) -->
        <meta property="og:type" content="website">
        <meta property="og:title" content="Gestor de Tareas - NovaTech">
        <meta property="og:description" content="Organiza tus tareas con autenticación segura. Demo en vivo.">
        <meta property="og:url" content="https://gestor-tareas-api-7efn.onrender.com">
        <meta property="og:site_name" content="Gestor de Tareas">
    
        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" content="Gestor de Tareas - NovaTech">
        <meta name="twitter:description" content="Organiza tus tareas con autenticación segura.">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <button class="theme-toggle theme-toggle-flotante" aria-label="Cambiar tema">
        <span class="icono-tema">🌙</span>
    </button>

    <div class="container">
        <h1>🚀 Gestor de Tareas</h1>
        <h2>Crear cuenta</h2>

        <form id="registro-form">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña (mínimo 8 caracteres):</label>
                <input type="password" id="password" required minlength="8">
            </div>

            <button type="submit">Registrarme</button>
        </form>

        <div id="mensaje-error" class="error hidden"></div>

        <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
    </div>

    <!-- Modal de éxito (registro) -->
    <div id="modal-exito-registro" class="modal hidden">
        <div class="modal-content modal-exito">
            <div class="exito-icono">
                <svg class="check-svg" viewBox="0 0 52 52">
                    <circle class="check-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="check-mark" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h2 class="exito-titulo">¡Cuenta creada!</h2>
            <p class="exito-texto">
                Tu cuenta ha sido registrada exitosamente.<br>
                Serás redirigido al inicio de sesión...
            </p>
            <div class="exito-progress">
                <div class="exito-progress-bar"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
