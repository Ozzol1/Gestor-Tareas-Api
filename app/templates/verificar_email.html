<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar email - Gestor de Tareas</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <button class="theme-toggle theme-toggle-flotante" aria-label="Cambiar tema">
        <span class="icono-tema">🌙</span>
    </button>

    <div class="container container-verificar" id="verificar-container">
        <!-- Estado de carga -->
        <div id="estado-cargando" class="verificar-estado">
            <div class="spinner-grande"></div>
            <h1>Verificando tu email...</h1>
            <p>Espera un momento por favor.</p>
        </div>

        <!-- Estado de éxito -->
        <div id="estado-exito" class="verificar-estado hidden">
            <div class="exito-icono">
                <svg class="check-svg" viewBox="0 0 52 52">
                    <circle class="check-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="check-mark" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h1 class="verificar-titulo">¡Email verificado!</h1>
            <p class="verificar-texto">
                Tu cuenta está activa. Ya puedes iniciar sesión.
            </p>
            <a href="/login" class="btn-404 btn-404-primary" style="margin-top: 20px; display: inline-block;">
                Ir al login
            </a>
        </div>

        <!-- Estado de error -->
        <div id="estado-error" class="verificar-estado hidden">
            <div class="error-icono">❌</div>
            <h1 class="verificar-titulo">Enlace inválido</h1>
            <p class="verificar-texto" id="error-mensaje">
                El enlace es inválido o ya fue utilizado.
            </p>
            <a href="/login" class="btn-404 btn-404-secondary" style="margin-top: 20px; display: inline-block;">
                Volver al login
            </a>
        </div>
    </div>

    <script>
        window.VERIFICAR_TOKEN = "{{ token }}";
    </script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script>
        (async function verificar() {
            const token = window.VERIFICAR_TOKEN;
            
            try {
                const response = await fetch(`/auth/verificar-email/${token}`);
                const data = await response.json();

                document.getElementById("estado-cargando").classList.add("hidden");

                if (response.ok) {
                    document.getElementById("estado-exito").classList.remove("hidden");
                } else {
                    document.getElementById("error-mensaje").textContent = data.error || "Enlace inválido.";
                    document.getElementById("estado-error").classList.remove("hidden");
                }
            } catch (e) {
                document.getElementById("estado-cargando").classList.add("hidden");
                document.getElementById("error-mensaje").textContent = "Error de conexión. Intenta de nuevo.";
                document.getElementById("estado-error").classList.remove("hidden");
            }
        })();
    </script>
</body>
</html>
