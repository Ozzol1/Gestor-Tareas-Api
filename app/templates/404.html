<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Gestor de Tareas</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <button class="theme-toggle theme-toggle-flotante" aria-label="Cambiar tema">
        <span class="icono-tema">🌙</span>
    </button>

    <div class="container container-404">
        <div class="error-404-icono">🚀</div>
        <h1 class="error-404-titulo">404</h1>
        <h2 class="error-404-subtitulo">Esta página se perdió en el espacio</h2>
        <p class="error-404-texto">
            La URL que buscas no existe o fue movida.<br>
            Pero no te preocupes, puedes volver a tu tablero.
        </p>
        <div class="error-404-acciones">
            <a href="/dashboard" class="btn-404 btn-404-primary">
                🏠 Volver al dashboard
            </a>
            <a href="/login" class="btn-404 btn-404-secondary">
                🔑 Iniciar sesión
            </a>
        </div>
    </div>
</body>
</html>
