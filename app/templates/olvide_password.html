<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Gestor de Tareas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <button class="theme-toggle theme-toggle-flotante" aria-label="Cambiar tema">
        <span class="icono-tema">🌙</span>
    </button>

    <div class="container">
        <h1>🔐 Recuperar contraseña</h1>
        <h2>Te enviaremos un enlace por email</h2>

        <form id="olvide-form">
            <div class="form-group">
                <label for="email">Email registrado:</label>
                <input type="email" id="email" required autofocus>
            </div>

            <button type="submit">Enviar enlace</button>
        </form>

        <div id="mensaje-error" class="error hidden"></div>
        <div id="mensaje-exito-form" class="exito hidden"></div>

        <p>Recuerda tu contraseña? <a href="/login">Inicia sesión</a></p>
    </div>

    <!-- Modal de éxito -->
    <div id="modal-email-enviado" class="modal hidden">
        <div class="modal-content modal-exito">
            <div class="exito-icono">
                <svg class="check-svg" viewBox="0 0 52 52">
                    <circle class="check-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="check-mark" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h2 class="exito-titulo">¡Email enviado!</h2>
            <p class="exito-texto">
                Si el email está registrado, recibirás un enlace<br>
                para restablecer tu contraseña en unos segundos.
            </p>
            <p class="exito-nota">
                Revisa tu bandeja de entrada y la carpeta de spam.
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/password_reset.js') }}"></script>
</body>
</html>
