version: "3.9"

services:
  api:
    build: .
    container_name: gestor-tareas-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/instance/tareas.db
      - PORT=5000
    volumes:
      - sqlite_data:/app/instance
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local